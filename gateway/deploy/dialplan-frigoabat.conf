; Substitui o bloco [internos-frigoabat] atual. Somente os ramais móveis
; cadastrados abaixo recebem push e esperam o aplicativo acordar.
[internos-frigoabat]
exten => _3XX,1,NoOp(FRIGOABAT: ${CALLERID(num)} -> ramal ${EXTEN})
 same => n,Set(CDR_PROP(disable)=1)
 same => n,Set(RAMAL_DESTINO=${EXTEN})
 same => n,GotoIf($[${REGEX("^(312|313)$" ${EXTEN})} = 0]?dial)
 same => n,Set(CONNECTE_CALL_ID=${CHANNEL(linkedid)})
 same => n,Set(CHANNEL(hangup_handler_push)=conecte-push-hangup,s,1(${CONNECTE_CALL_ID},${EXTEN}))
 same => n,UserEvent(ConecteIncoming,CallId:${CONNECTE_CALL_ID},Extension:${EXTEN},CallerNum:${FILTER(0-9+,${CALLERID(num)})})
 same => n,Wait(4)
 same => n(dial),Dial(PJSIP/${EXTEN}${INTERNAL_DIAL_OPT})
 same => n,Goto(frigo-${DIALSTATUS},1)

[conecte-push-hangup]
exten => s,1,UserEvent(ConecteEnded,CallId:${ARG1},Extension:${ARG2})
 same => n,Return()
