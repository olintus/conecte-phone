name: ConectePhone
options:
  bundleIdPrefix: br.com.conectemax
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.6.4"
    CURRENT_PROJECT_VERSION: "21"
packages:
  LinphoneSDK:
    url: https://gitlab.linphone.org/BC/public/linphone-sdk-swift-ios.git
    exactVersion: 5.5.15
targets:
  ConectePhone:
    type: application
    platform: iOS
    sources:
      - path: ConectePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.conectemax.phone
        INFOPLIST_FILE: ConectePhone/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ConectePhone/Resources/ConectePhone.entitlements
        PRODUCT_NAME: Conecte Phone
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: LinphoneSDK
        product: linphonesw
    entitlements:
      path: ConectePhone/Resources/ConectePhone.entitlements
  ConectePhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConectePhoneTests
    dependencies:
      - target: ConectePhone
